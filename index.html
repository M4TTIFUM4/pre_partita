<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Born to Dreams – Nuova Olonio · Pre partita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,600;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1014; --bg2:#152026;
  --red:#e4322b; --green:#1f8a3a; --white:#f5f2ea; --dim:#9aa4ab;
  --font:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--white);font-family:var(--font);overflow:hidden}
*{box-sizing:border-box}

/* stage 16:9 always filling the window */
#stage{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;background:radial-gradient(ellipse at 50% 40%,var(--bg2) 0%,var(--bg) 70%);overflow:hidden}

/* pitch lines */
.pitch{position:absolute;inset:0;opacity:.14;
  background-image:
    repeating-linear-gradient(90deg,transparent 0 118px,rgba(255,255,255,.05) 118px 240px);
}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:1400px;height:1400px;border:3px solid rgba(255,255,255,.35);border-radius:50%;transform:translate(-50%,-50%)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:rgba(255,255,255,.35);transform:translateX(-50%)}

/* team glows */
.glow{position:absolute;top:-300px;width:1400px;height:1700px;opacity:.75}
.glow.l{left:-500px;background:radial-gradient(closest-side,var(--red),rgba(228,50,43,.35) 35%,transparent 80%)}
.glow.r{right:-500px;background:radial-gradient(closest-side,var(--green),rgba(31,138,58,.35) 35%,transparent 80%)}


/* floodlight sweep – the one orchestrated motion */



/* layout */
.top{position:absolute;top:90px;left:0;right:0;text-align:center;font-weight:500;font-size:34px;letter-spacing:.08em;color:var(--dim)}
.top b{color:var(--white);font-weight:700;letter-spacing:.06em}

.teams{position:absolute;top:250px;left:0;right:0;display:flex;align-items:flex-start}
.team{flex:1 1 0;width:0}
.vs{flex:0 0 260px;width:260px}
.team{display:flex;flex-direction:column;align-items:center;gap:26px;min-width:0}
.team h2{margin:0;width:100%;font-size:78px;line-height:.95;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.01em;text-align:center;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.7)}
.team h2 .ln{display:block;white-space:nowrap}
.team h2 .sub{margin-top:12px}

/* 3D solids */
.badge{width:440px;height:440px}
.solid{position:relative;width:100%;height:100%}


.face,.layer{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face{display:grid;place-items:center;overflow:hidden}
.face img,.face svg{width:100%;height:100%;object-fit:contain;display:block}

.face.front{box-shadow:0 40px 60px rgba(0,0,0,.55),inset 0 0 0 3px rgba(255,255,255,.55),inset 0 0 0 5px rgba(255,255,255,.12),inset 0 -40px 60px rgba(0,0,0,.28),inset 0 30px 60px rgba(255,255,255,.18)}
.layer{backface-visibility:visible;-webkit-backface-visibility:visible}
/* glass finish shared by both solids */
.face{border-radius:var(--r);background:var(--glass);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 0 0 0 5px rgba(255,255,255,.12),inset 0 -40px 60px rgba(0,0,0,.28),inset 0 30px 60px rgba(255,255,255,.18)}
.face img,.face svg{position:relative;z-index:1}
.face::before{content:"";position:absolute;inset:0;z-index:2;border-radius:var(--r);pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.28) 22%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 62%,rgba(255,255,255,.14) 80%,rgba(255,255,255,.34) 100%)}



.layer{border-radius:var(--r);background:rgba(190,225,235,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),inset 0 0 26px rgba(160,220,240,.35)}
/* coin (Nuova Olonio): dark green glass */
.coin{--d:18px;--r:50%;--glass:radial-gradient(circle at 35% 30%,rgba(60,140,90,.9),rgba(8,40,22,.92) 70%)}
.coin .face img{opacity:.93;mix-blend-mode:normal;border-radius:50%}
/* plaque (Born to Dreams): frosted white glass */
.plaque{--d:16px;--r:38px;--glass:linear-gradient(150deg,rgba(255,255,255,.88),rgba(235,240,245,.72) 55%,rgba(255,255,255,.84))}
.plaque .face{padding:22px}
.vs{text-align:center;font-style:italic;font-weight:900;font-size:150px;line-height:1;position:relative;margin-top:145px}
.vs span{position:relative;display:inline-block;color:var(--white);
  background:linear-gradient(110deg,var(--red) 0 48%,var(--white) 48% 52%,var(--green) 52% 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}

.vs::before,.vs::after{content:"";position:absolute;top:50%;width:70px;height:6px;background:rgba(255,255,255,.25);transform:translateY(-50%)}
.vs::before{left:-10px}.vs::after{right:-10px}


</style>
</head>

<script>
(function(){
  var q;try{q=new URLSearchParams(location.search)}catch(e){q={get:function(){return null}}}
  if(q.get('title')) document.getElementById('title').textContent=q.get('title');
  if(q.get('home')) document.querySelector('.team.home .ln').textContent=q.get('home');
  if(q.get('away')) document.querySelector('.team.away .ln').textContent=q.get('away');
  if(q.get('sub1')) document.querySelector('.team.home .sub').textContent=q.get('sub1');
  function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.documentElement.style.setProperty('--s',s)}
  addEventListener('resize',fit);fit();
  // ogni riga del nome usa la dimensione massima (78px) e si riduce solo se non entra nella colonna
  function fitNames(){
    Array.prototype.forEach.call(document.querySelectorAll('.team h2'),function(h){
      var w=h.clientWidth-20;
      Array.prototype.forEach.call(h.querySelectorAll('.ln'),function(l){
        l.style.fontSize='78px';
        var tw=l.scrollWidth; if(tw>w) l.style.fontSize=Math.floor(78*w/tw)+'px';
      });
    });
  }
  fitNames(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitNames); setTimeout(fitNames,1500);
})();
</script>
